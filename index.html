<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza & Vin – Konkurranse</title>
<style>
  :root { --bg:#fdf6ee; --card:#fff; --red:#b3261e; --wine:#6d1a36; --ink:#2b2b2b; --mute:#888; --line:#e6dccf; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--wine); color:#fff; padding:14px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.25rem; flex:1; }
  header .who { font-size:.85rem; opacity:.85; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { background:transparent; color:#fff; border:1px solid #fff8; border-radius:6px; padding:6px 12px; cursor:pointer; }
  nav button.active { background:#fff; color:var(--wine); }
  main { max-width:1000px; margin:0 auto; padding:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  h2 { margin:4px 0 12px; color:var(--wine); }
  h3 { margin:0 0 8px; }
  input[type=text], input[type=password] { padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:1rem; width:100%; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .btn { background:var(--red); color:#fff; border:0; border-radius:6px; padding:9px 16px; cursor:pointer; font-size:1rem; }
  .btn.ghost { background:#fff; color:var(--red); border:1px solid var(--red); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .tag { display:inline-block; font-size:.8rem; padding:2px 8px; border-radius:99px; background:#f1e4d3; margin-left:4px; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 6px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:.8rem; color:var(--mute); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .dice { display:flex; gap:4px; }
  .dice button { width:40px; height:40px; font-size:1.7rem; line-height:1; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; padding:0; color:#bbb; }
  .dice button.on { background:var(--red); color:#fff; border-color:var(--red); }
  .pills { display:flex; gap:6px; flex-wrap:wrap; }
  .pills button { border:1px solid var(--wine); background:#fff; color:var(--wine); border-radius:99px; padding:7px 16px; cursor:pointer; }
  .pills button.on { background:var(--wine); color:#fff; }
  .medal { font-size:1.2rem; }
  .winner { font-size:1.05rem; margin-bottom:4px; }
  .winner b { color:var(--wine); }
  .muted { color:var(--mute); font-size:.85rem; }
  .err { color:var(--red); }
  .hidden { display:none !important; }
  #login { max-width:380px; margin:40px auto; }
</style>
</head>
<body>

<header>
  <h1>🍕🍷 Pizza & Vin</h1>
  <span class="who" id="who"></span>
  <nav id="nav" class="hidden">
    <button data-tab="stem" class="active">Terningkast</button>
    <button data-tab="resultat">Resultater</button>
    <button data-tab="oppsett" id="tabOppsett" class="hidden">Oppsett</button>
    <button id="logout">Logg ut</button>
  </nav>
</header>

<main>
  <!-- INNLOGGING -->
  <section id="login" class="card">
    <h2>Logg inn</h2>
    <div class="row"><input type="text" id="loginName" placeholder="Brukernavn (f.eks. Kari)" autocomplete="username"></div>
    <div class="row"><input type="password" id="loginPin" placeholder="Konkurranse-PIN" inputmode="numeric"></div>
    <button class="btn" id="loginBtn" style="width:100%">Logg inn</button>
    <p class="err" id="loginErr"></p>
  </section>

  <!-- STEMMING -->
  <section id="stem" class="hidden">
    <div class="card"><div class="pills" id="daySel"></div></div>
    <div id="voteArea"></div>
  </section>

  <!-- RESULTAT -->
  <section id="resultat" class="hidden"><div id="results"></div></section>

  <!-- OPPSETT (kun admin) -->
  <section id="oppsett" class="hidden">
    <div class="card">
      <h2>Pizzaer og viner</h2>
      <p class="muted">Endringer lagres automatisk og vises for alle.</p>
      <div id="pizzaSetup"></div>
    </div>
    <div class="card">
      <h2>Dommere</h2>
      <div id="judgeAdmin"></div>
    </div>
    <div class="card">
      <button class="btn ghost" id="exportBtn">Eksporter alle terningkast (CSV)</button>
    </div>
  </section>
</main>

<script type="module">
// ================= KONFIGURASJON =================
// 1) Lim inn firebaseConfig fra Firebase-konsollen (Prosjektinnstillinger → Dine apper → Web).
const firebaseConfig = {
  apiKey: "LIM_INN",
  authDomain: "LIM_INN",
  projectId: "LIM_INN",
  storageBucket: "LIM_INN",
  messagingSenderId: "LIM_INN",
  appId: "LIM_INN"
};
// 2) Felles PIN som alle deltakere må skrive inn.
const PIN = "1234";
// 3) Brukernavn som får tilgang til Oppsett (små bokstaver).
const ADMINS = ["admin"];
// =================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const db = getFirestore(initializeApp(firebaseConfig));
const oppsettRef = doc(db, "konkurranse", "oppsett");
const stemmerRef = collection(db, "stemmer");

const DICE = ['⚀','⚁','⚂','⚃','⚄','⚅'];
const CATS = [['pizza','Pizza'],['vin','Vin'],['kombo','Kombo']];
const DEFAULT_PIZZAS = Array.from({length:8}, (_, i) => ({ day: i < 4 ? 1 : 2, name: `Pizza ${i+1}`, wine: '' }));

let pizzas = DEFAULT_PIZZAS;
let votes = {};          // votes[brukerId] = { navn, scores: { [idx]: {pizza, vin, kombo} } }
let me = JSON.parse(localStorage.getItem('pizzaBruker') || 'null');   // { id, navn }
let curDay = 1, curTab = 'stem';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => v == null ? '–' : v.toFixed(2).replace('.', ',');
const isAdmin = () => me && ADMINS.includes(me.id);

// ---------- Innlogging ----------
function login() {
  const navn = $('loginName').value.trim();
  if (!navn) return $('loginErr').textContent = 'Skriv inn et brukernavn.';
  if ($('loginPin').value.trim() !== PIN) return $('loginErr').textContent = 'Feil PIN.';
  me = { id: navn.toLowerCase(), navn };
  localStorage.setItem('pizzaBruker', JSON.stringify(me));
  start();
}
$('loginBtn').onclick = login;
$('loginPin').onkeydown = e => { if (e.key === 'Enter') login(); };
$('logout').onclick = () => { localStorage.removeItem('pizzaBruker'); location.reload(); };

let started = false;
function start() {
  $('login').classList.add('hidden');
  $('nav').classList.remove('hidden');
  $('tabOppsett').classList.toggle('hidden', !isAdmin());
  $('who').textContent = `👤 ${me.navn}`;
  showTab(curTab);
  if (started) return;
  started = true;
  onSnapshot(oppsettRef, s => {
    if (s.exists()) pizzas = s.data().pizzas;
    else if (isAdmin()) setDoc(oppsettRef, { pizzas: DEFAULT_PIZZAS });
    render();
  }, showDbError);
  onSnapshot(stemmerRef, s => {
    votes = {};
    s.forEach(d => votes[d.id] = d.data());
    render();
  }, showDbError);
}
function showDbError(e) {
  $('voteArea').innerHTML = $('results').innerHTML =
    `<div class="card err">Får ikke kontakt med databasen: ${esc(e.message)}<br>Sjekk firebaseConfig og Firestore-reglene.</div>`;
}

// ---------- Faner ----------
function showTab(t) {
  curTab = t;
  document.querySelectorAll('nav button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  ['stem','resultat','oppsett'].forEach(id => $(id).classList.toggle('hidden', id !== t));
}
document.querySelectorAll('nav button[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ---------- Terningkast ----------
function renderVote() {
  $('daySel').innerHTML = [1, 2].map(d => `<button class="${d === curDay ? 'on' : ''}" data-day="${d}">Dag ${d}</button>`).join('');
  const my = votes[me.id]?.scores || {};
  $('voteArea').innerHTML = pizzas.map((p, i) => p.day !== curDay ? '' : `
    <div class="card">
      <h3>🍕 ${esc(p.name)} <span class="tag">🍷 ${esc(p.wine || 'vin ikke satt')}</span></h3>
      <table>${CATS.map(([k, label]) => `
        <tr><td style="width:70px">${label}</td><td><div class="dice">${DICE.map((f, n) =>
          `<button class="${my[i]?.[k] === n+1 ? 'on' : ''}" data-i="${i}" data-k="${k}" data-v="${n+1}">${f}</button>`).join('')}
        </div></td></tr>`).join('')}
      </table>
    </div>`).join('');
}
$('daySel').onclick = e => { const d = e.target.dataset.day; if (d) { curDay = +d; renderVote(); } };
$('voteArea').onclick = e => {
  const { i, k, v } = e.target.dataset;
  if (!k) return;
  const scores = structuredClone(votes[me.id]?.scores || {});
  scores[i] ??= {};
  if (scores[i][k] === +v) delete scores[i][k];   // klikk igjen for å angre
  else scores[i][k] = +v;
  votes[me.id] = { navn: me.navn, scores };        // vis med en gang
  renderVote();
  setDoc(doc(stemmerRef, me.id), { navn: me.navn, scores }).catch(showDbError);
};

// ---------- Resultater ----------
const avg = a => { a = a.filter(x => x != null); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
function stats() {
  const judges = Object.values(votes);
  return pizzas.map((p, i) => {
    const r = { ...p, idx: i };
    CATS.forEach(([k]) => r[k] = avg(judges.map(j => j.scores?.[i]?.[k])));
    r.total = avg(CATS.map(([k]) => r[k]));
    r.votes = judges.filter(j => CATS.some(([k]) => j.scores?.[i]?.[k])).length;
    return r;
  });
}
function rankTable(list, title) {
  const sorted = [...list].sort((a, b) => (b.total ?? -1) - (a.total ?? -1));
  const medals = ['🥇','🥈','🥉'];
  return `<div class="card"><h2>${title}</h2><div class="scroll"><table>
    <tr><th></th><th>Pizza / vin</th><th class="num">Pizza</th><th class="num">Vin</th><th class="num">Kombo</th><th class="num">Snitt</th><th class="num">Stemmer</th></tr>
    ${sorted.map((r, n) => `<tr>
      <td class="medal">${r.total != null ? (medals[n] || n+1) : ''}</td>
      <td>${esc(r.name)}<br><span class="muted">🍷 ${esc(r.wine)} · dag ${r.day}</span></td>
      <td class="num">${fmt(r.pizza)}</td><td class="num">${fmt(r.vin)}</td><td class="num">${fmt(r.kombo)}</td>
      <td class="num"><b>${fmt(r.total)}</b></td><td class="num">${r.votes}</td></tr>`).join('')}
  </table></div></div>`;
}
function renderResults() {
  const s = stats();
  const best = k => s.filter(r => r[k] != null).sort((a, b) => b[k] - a[k])[0];
  const w = (k, label, icon) => { const b = best(k);
    const what = !b ? '–' : k === 'vin' ? `<b>${esc(b.wine || b.name)}</b>` : k === 'kombo' ? `<b>${esc(b.name)} + ${esc(b.wine)}</b>` : `<b>${esc(b.name)}</b>`;
    return `<div class="winner">${icon} Beste ${label}: ${what} ${b ? `(${fmt(b[k])})` : ''}</div>`; };
  const names = Object.values(votes).map(v => esc(v.navn)).join(', ') || 'ingen ennå';
  $('results').innerHTML = `
    <div class="card"><h2>🏆 Ledere akkurat nå</h2>
      ${w('total','totalt','🏆')}${w('kombo','kombo','🤝')}${w('pizza','pizza','🍕')}${w('vin','vin','🍷')}
      <p class="muted">Dommere: ${names}. Snitt = gjennomsnitt av pizza, vin og kombo. Oppdateres live.</p>
    </div>
    ${rankTable(s, 'Sammenlagt – alle 8')}
    ${rankTable(s.filter(r => r.day === 1), 'Dag 1')}
    ${rankTable(s.filter(r => r.day === 2), 'Dag 2')}`;
}

// ---------- Oppsett (admin) ----------
let saveTimer;
function renderSetup() {
  if (!isAdmin() || document.activeElement?.closest?.('#pizzaSetup')) return;   // ikke tegn om mens man skriver
  $('pizzaSetup').innerHTML = [1, 2].map(d => `
    <h3>Dag ${d}</h3>
    <div class="grid2" style="margin-bottom:14px">${pizzas.map((p, i) => p.day !== d ? '' : `
      <div class="card" style="margin:0">
        <div class="muted">#${i+1}</div>
        <div class="row">🍕 <input type="text" value="${esc(p.name)}" data-i="${i}" data-k="name"></div>
        <div class="row">🍷 <input type="text" value="${esc(p.wine)}" placeholder="Vin" data-i="${i}" data-k="wine"></div>
      </div>`).join('')}
    </div>`).join('');
  $('judgeAdmin').innerHTML = Object.entries(votes).map(([id, v]) =>
    `<div class="row"><span style="flex:1">👤 ${esc(v.navn)}</span><button class="btn ghost" data-del="${esc(id)}">Slett stemmer</button></div>`
  ).join('') || '<p class="muted">Ingen har stemt ennå.</p>';
}
$('pizzaSetup').oninput = e => {
  const { i, k } = e.target.dataset;
  pizzas = structuredClone(pizzas);
  pizzas[i][k] = e.target.value;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => setDoc(oppsettRef, { pizzas }).catch(showDbError), 500);
};
$('judgeAdmin').onclick = e => {
  const id = e.target.dataset.del;
  if (id && confirm(`Slette alle terningkast fra ${votes[id].navn}?`)) deleteDoc(doc(stemmerRef, id));
};
$('exportBtn').onclick = () => {
  const rows = [['Dommer','Dag','Pizza','Vin','Pizza-poeng','Vin-poeng','Kombo-poeng']];
  Object.values(votes).forEach(v => pizzas.forEach((p, i) => {
    const sc = v.scores?.[i] || {};
    rows.push([v.navn, p.day, p.name, p.wine, sc.pizza ?? '', sc.vin ?? '', sc.kombo ?? '']);
  }));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = 'pizzakonkurranse.csv'; a.click();
};

function render() { if (!me) return; renderVote(); renderResults(); renderSetup(); }
if (me) start();
</script>
</body>
</html>
